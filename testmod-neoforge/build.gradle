
architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    mixin {
        defaultRefmapName = "peaktest-neoforge.refmap.json"
    }

    mods {
        register("neoforge") {
            sourceSet("main", ":neoforge")
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = true }
    common(project(path: ':testmod-common', configuration: 'namedElements')) { transitive = true }

    implementation project(path: ':neoforge', configuration: 'namedElements')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}